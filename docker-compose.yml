services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lohela
      POSTGRES_PASSWORD: lohela_pass
      POSTGRES_DB: lohela
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lohela"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    image: lohela-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lohela:lohela_pass@postgres:5432/lohela
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: alembic upgrade head

  backend:
    image: lohela-backend:latest
    build:
      # Root context: the image also builds the React client (see Dockerfile).
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lohela:lohela_pass@postgres:5432/lohela
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  celery_worker:
    image: lohela-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lohela:lohela_pass@postgres:5432/lohela
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.pipeline worker --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
